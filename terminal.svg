<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="320">
  <style>
    .bg { fill: #282828; rx: 12px; }
    .header { fill: #1d2021; }
    .dot-red { fill: #fb4934; }
    .dot-yellow { fill: #fabd2f; }
    .dot-green { fill: #b8bb26; }
    .terminal-text {
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      font-size: 14px;
      fill: #ebdbb2;
    }
    .prompt-user { fill: #b8bb26; font-weight: bold; }
    .prompt-host { fill: #8ec07c; font-weight: bold; }
    .separator { fill: #a89984; }
    .key { fill: #83a598; font-weight: bold; }
    .val { fill: #ebdbb2; }
    .ascii { 
      fill: #fe8019; 
      font-weight: bold; 
      font-family: 'Apple Braille', 'Segoe UI Symbol', 'DejaVu Sans', monospace; 
      font-size: 13px; 
    }
  </style>

  <rect class="bg" width="500" height="320" />
  
  <path class="header" d="M 12,0 h 476 a 12,12 0 0 1 12,12 v 24 h -500 v -24 a 12,12 0 0 1 12,-12 z" />
  
  <circle class="dot-red" cx="25" cy="18" r="6" />
  <circle class="dot-yellow" cx="45" cy="18" r="6" />
  <circle class="dot-green" cx="65" cy="18" r="6" />
  
  <text x="250" y="23" font-family="'Fira Code', monospace" font-size="12" fill="#a89984" text-anchor="middle">kitty</text>
  
