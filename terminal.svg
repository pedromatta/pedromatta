    <text x="20" y="152">⢸⡇<tspan fill="transparent">⣿</tspan>⣠⠞<tspan fill="transparent">⣿</tspan>⠛⢃⡴⠺⡽⠓⢄⠛⠓<tspan fill="transparent">⣿</tspan>⠹⣄<tspan fill="transparent">⣿</tspan>⢸⡇</text>
