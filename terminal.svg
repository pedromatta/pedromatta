    <text x="20" y="188">⢸⡇⢸⡄<tspan fill="transparent">⣿⣿⣿</tspan>⠹⣄⣰⠳⣀⡴⠃<tspan fill="transparent">⣿⣿⣿</tspan>⢀⡿⢼⡇</text>
